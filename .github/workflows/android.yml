name: Build PrediBol Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "manifest.webmanifest"
      - "preguntas_extra.json"
      - "noticias.json"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android.yml"
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install Capacitor
        run: npm install
      - name: Prepare bundled web assets
        run: |
          mkdir -p web/assets
          cp index.html manifest.webmanifest preguntas_extra.json noticias.json sw.js web/
          cp assets/* web/assets/
      - name: Create Android project
        run: npx cap add android
      - name: Sync web app into Android
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PrediBol-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
